name: Build Finance Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/singhabhi0716/financecalculator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "My-Finance-Calculators"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.singhabhi0716.financecalculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.singhabhi0716.financecalculator'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  My Finance Calculators
              </string>

          </resources>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:statusBarColor">#000000</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#18864B"
                  android:pathData="M16,8 L92,8 Q100,8 100,16 L100,92 Q100,100 92,100 L16,100 Q8,100 8,92 L8,16 Q8,8 16,8Z"/>

              <path
                  android:fillColor="#FFF8E8"
                  android:pathData="M31,31 L77,31 L77,39 L62,39 L62,44 L73,44 L73,51 L62,51 L62,74 L53,74 L53,51 L35,51 L35,44 L53,44 L53,39 L31,39Z"/>

              <path
                  android:fillColor="#FFF8E8"
                  android:pathData="M27,78 L27,60 L35,60 L35,78Z M40,78 L40,52 L48,52 L48,78Z M53,78 L53,43 L61,43 L61,78Z M66,78 L66,35 L74,35 L74,78Z"/>

          </vector>
          EOF


          cat > app/src/main/java/com/singhabhi0716/financecalculator/MainActivity.java <<'EOF'
          package com.singhabhi0716.financecalculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.setStatusBarColor(0xFF000000);
                  window.setNavigationBarColor(0xFF000000);

                  webView = new WebView(this);

                  webView.setBackgroundColor(0xFF000000);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(false);

                  settings.setAllowContentAccess(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  webView.loadUrl(
                      "https://singhabhi0716-alt.github.io/Finance-Calculator/"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }

          }
          EOF


      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-Calculators-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
